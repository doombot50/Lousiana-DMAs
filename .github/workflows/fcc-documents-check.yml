# FCC documents check — reads a small sample of political-file documents
# (one order, invoice and request form per station) when the document reader
# changes, and prints each one's text beside what it parsed to, so the parser
# can be checked against the real stations' sales systems. Commits nothing.

name: FCC documents check

on:
  workflow_dispatch:
  push:
    paths:
      - fcc/read_documents.py
      - fcc/documents.py
      - .github/workflows/fcc-documents-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pdftotext and tesseract
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils tesseract-ocr
      - name: TV sample
        run: python3 fcc/read_documents.py --sample 25
      - name: Restore document text
        uses: actions/cache/restore@v4
        with:
          path: .doc_text
          key: doc-text-check-${{ github.run_id }}
          restore-keys: doc-text-
      # Where the nightly's minutes go: the slowest kept texts to parse, and
      # each phase of the KTBS documents that stalled past four minutes.
      - name: Timings
        timeout-minutes: 20
        run: |
          python3 - <<'PY'
          import glob, gzip, json, sys, time
          sys.path.insert(0, 'fcc')
          from documents import parse
          t0 = time.time(); out = []
          for p in glob.glob('.doc_text/*/*.txt.gz'):
              t1 = time.time(); text = gzip.open(p, 'rt').read(); t2 = time.time()
              parse(text); out.append((time.time() - t2, t2 - t1, len(text), p))
          print(f'{len(out)} texts in {time.time() - t0:.1f}s')
          for x in sorted(out, reverse=True)[:12]:
              print(f'  parse {x[0]:7.2f}s  gunzip {x[1]:5.2f}s  {x[2]:9,d}  {x[3]}')
          PY
          python3 - <<'PY'
          import json, sys, time
          sys.path.insert(0, 'fcc')
          import scrape_political_files as sp
          import read_documents as rd
          from documents import parse
          from read_documents import candidates, download_url, pdf_text
          L = json.load(open('data/fcc_political.json'))
          want = {'20260424172600627', '20260416155914894', 'o18007'}
          seen = set()
          for call, f, kind in candidates(L, 'tv', set()):
              if call != 'KTBS' or f['name'] not in want or f['name'] in seen:
                  continue
              seen.add(f['name'])
              t = time.time(); data = sp.get(download_url(f), raw=True, max_bytes=rd.MAX_BYTES)
              print(f['name'], 'download', round(time.time() - t, 1), 's', len(data or b''), 'bytes', flush=True)
              t = time.time(); text, how = pdf_text(data)
              print('  text', how, round(time.time() - t, 1), 's', len(text), 'chars', flush=True)
              t = time.time(); parse(text)
              print('  parse', round(time.time() - t, 1), 's', flush=True)
          PY
      - name: Radio sample
        run: python3 fcc/read_documents.py --media radio --sample 4
      # Radio's own layouts: iHeartMedia's order confirmations and the
      # small stations' scanned orders, most of them read but unpriced.
      - name: Radio layouts
        run: |
          python3 fcc/read_documents.py --media radio --sample 12 --names \
            accountability_project_inc_order_confirmation_1100655318 \
            mark_spencer_for_senate_order_confirmation_1923743463 \
            club_for_growth_order_confirmation_1100682003 \
            sherman_mack_for_da_order_confirmation_9001395062 \
            "CAPTAIN HIGGINS FOR LOUISIANA" JohnAtkiinsKRVVorders \
            "Satrica Wilkiams" "Steve Gunnell" AlvinSharpKMLBorders \
            "SLADE SANDERS"
      # The nightly path end to end, into a scratch copy: read a few
      # documents, then roll them up as the pages do.
      - name: Nightly read, then rollup
        run: |
          python3 fcc/read_documents.py --budget 12 --minutes 8
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, 'fcc')
          from summary import fcc_summary
          d = json.load(open('data/fcc_documents.json'))['documents']
          for k, v in list(d.items())[:12]:
              print(v['status'], v.get('kind'), v.get('gross'), v.get('agency'), '|', v['call'], v['name'])
          m = {s['call']: s['dma'] for s in json.load(open('data/stations.json'))}
          F = fcc_summary({c: 'NO' for c in m}, full=True)
          print('usd', F['usd'])
          for x in F['all']:
              if 'usd' in x:
                  print(' ', x['name'], x['usd'])
          PY
