# Temporary: runs fcc/probe.py where publicfiles.fcc.gov is reachable, so the
# political-file scraper can be developed against the real API. Removed before
# the scraper PR is marked ready.
name: FCC probe
on:
  push:
    branches: [claude/louisiana-election-utility-grqh6d]
    paths: ['fcc/**', '.github/workflows/fcc-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - run: python3 fcc/scrape_political_files.py --years 2026 2027
      - run: python3 fcc/probe.py
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fcc-political
          path: |
            data/fcc_political.json
            data/fcc_facilities.json
