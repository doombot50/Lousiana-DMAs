# Nightly rebuild — keeps both pages current with the state's filings.
#
# la-campaign-finance refreshes its `data-cache` release from the Louisiana
# Ethics Administration at 09:00 UTC; this runs two hours later, re-derives
# every dollar figure from that cache, rebuilds index.html / radio.html and
# their artifact fragments, and commits them. GitHub Pages serves the repo
# root, so the commit is the deploy.
#
# Every build stamps today's date into data/*.json as `generated`; a run whose
# only difference is that stamp commits nothing, so history shows a commit
# only on nights the filings actually moved.

name: Nightly rebuild

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'   # 5-6am Central, after the upstream refresh

concurrency:
  group: nightly-rebuild
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch expenditure filings
        run: python3 fetch_cache.py

      - name: Rebuild data
        run: |
          python3 build_station_spend.py
          python3 build_radio_spend.py

      - name: Rebuild pages
        run: |
          python3 build_page.py
          python3 build_radio_page.py

      - name: Commit if the filings changed
        run: |
          if git diff --quiet -I'"generated":' -- data/ '*.html'; then
            echo "No new filings since the last build; nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898299+github-actions[bot]@users.noreply.github.com'
          git add data/ '*.html'
          through=$(python3 -c "import json; print(json.load(open('data/station_spend.json'))['data_through'])")
          git commit -m "Nightly rebuild: filings through $through"
          git push
