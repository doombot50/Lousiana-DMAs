# Nightly rebuild — keeps both pages current with the state's filings.
#
# la-campaign-finance refreshes its `data-cache` release from the Louisiana
# Ethics Administration at 09:00 UTC; this runs two hours later, re-derives
# every dollar figure from that cache, rebuilds index.html / radio.html /
# committees.html / races.html and their artifact fragments, and commits them. GitHub Pages serves the repo
# root, so the commit is the deploy.
#
# It also refreshes the FCC political files (fcc/) of the 30 TV stations, the
# cable systems serving Louisiana and the radio stations the radio page
# covers, which only
# GitHub's runners can reach. That step may fail on its own, an FCC outage or
# CDN block, without holding back the state-filings rebuild: the page then
# keeps the previous night's political-file data, marked stale.
#
# It also refreshes the Secretary of State's ballot (fetch_ballot.py) for the
# races page, which joins it to the finance totals fetch_cache.py pulls from
# la-campaign-finance, and the FEC's totals for federal candidates
# (fetch_fec.py).
#
# Last, a freshness check opens a GitHub issue if any source has gone more
# than three days without updating, and closes it once all are fresh.
#
# Every build stamps today's date into data/*.json as `generated` (and the FCC
# file its `scraped` time); a run whose only difference is those stamps
# commits nothing.

name: Nightly rebuild

on:
  workflow_dispatch:
  schedule:
    # 11:17 UTC (5-6am Central), after the upstream refresh. Off the hour on
    # purpose: GitHub delays or drops scheduled runs at :00 when its queue is
    # busy, and the 11:00 schedule this replaced never fired once.
    - cron: '17 11 * * *'
    # 23:17 UTC: a second pass in the last 30 days before an election on
    # data/ballot.json, when the political files move fastest. The gate job
    # skips it the rest of the year.
    - cron: '17 23 * * *'

concurrency:
  group: nightly-rebuild
  cancel-in-progress: false

permissions:
  contents: write
  issues: write     # the freshness check opens and closes its own issue

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.close.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: data/ballot.json
      - id: close
        env:
          EVENING: ${{ github.event.schedule == '17 23 * * *' }}
        run: |
          go=true
          if [ "$EVENING" = true ]; then
            go=$(python3 -c "
          import json, datetime
          today = datetime.date.today()
          try:
              days = [datetime.date.fromisoformat(e['date']) for e in json.load(open('data/ballot.json'))['elections']]
          except (OSError, ValueError, KeyError):
              days = []
          print(str(any(0 <= (d - today).days <= 30 for d in days)).lower())")
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "Run the rebuild: $go"

  rebuild:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The name rules and matching have regression tests built from real
      # filings they once misread; a failure stops the run before anything
      # is rebuilt or published.
      - name: Test
        run: python3 -m unittest discover -s tests

      - name: Fetch expenditure filings
        run: python3 fetch_cache.py

      - name: Rebuild data
        run: python3 build_spend.py

      # The Secretary of State's ballot for the races page: races, candidates,
      # and on election nights the votes. Like the FCC step, a failure keeps
      # the previous night's copy rather than failing the run. It runs first
      # because the FCC step reads the election dates to set its pace.
      - name: Refresh the ballot
        continue-on-error: true
        timeout-minutes: 20
        run: python3 fetch_ballot.py

      # The FEC's daily summary of House and Senate campaigns, for the races
      # page's federal candidates. A failure keeps the previous copy.
      - name: Refresh FEC totals
        continue-on-error: true
        timeout-minutes: 10
        run: python3 fetch_fec.py

      - name: Refresh FCC political files
        continue-on-error: true
        timeout-minutes: 60
        run: python3 fcc/scrape_political_files.py

      # Cable systems and radio stations file political ads the same way;
      # each has its own rotation and file, after TV so a CDN block costs
      # TV nothing.
      - name: Refresh cable political files
        continue-on-error: true
        timeout-minutes: 30
        run: python3 fcc/scrape_political_files.py --media cable

      - name: Refresh radio political files
        continue-on-error: true
        timeout-minutes: 40
        run: python3 fcc/scrape_political_files.py --media radio

      - name: Refresh satellite political files
        continue-on-error: true
        timeout-minutes: 15
        run: python3 fcc/scrape_political_files.py --media dbs

      - name: Rebuild pages
        run: |
          python3 build_page.py
          python3 build_radio_page.py
          python3 build_races_page.py
          python3 build_committees_page.py

      - name: Commit if the filings changed
        run: |
          if git diff --quiet -I'"generated":' -I'"scraped":' -I'"fetched":' -- data/ '*.html'; then
            echo "No new filings since the last build; nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898299+github-actions[bot]@users.noreply.github.com'
          git add data/ '*.html'
          through=$(python3 -c "import json; print(json.load(open('data/station_spend.json'))['data_through'])")
          git commit -m "Nightly rebuild: filings through $through"
          git push

      # Each step above keeps the site up when a source falters, which also
      # means nobody hears about it. This opens an issue (GitHub emails the
      # repo's watchers) when a source is more than three days old, edits it
      # while the problem lasts, and closes it once everything is fresh.
      # It runs even when an earlier step failed.
      - name: Check data freshness
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          upstream=$(gh api repos/doombot50/la-campaign-finance/releases/tags/data-cache \
                       --jq '[.assets[].updated_at] | max' 2>/dev/null || true)
          title='Nightly rebuild: site data has stopped updating'
          open=$(gh issue list --state open --json number,title \
                   --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          if python3 check_freshness.py --upstream "$upstream" --report freshness.md; then
            if [ -n "$open" ]; then
              gh issue close "$open" --comment "$(cat freshness.md)"
            fi
          elif [ -n "$open" ]; then
            gh issue edit "$open" --body-file freshness.md
          else
            gh issue create --title "$title" --body-file freshness.md
          fi
